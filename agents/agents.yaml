# AI Agents Manifest
# Defines available AI agents for the CADE platform.
#
# available: true  → agent has a runnable Docker image (local or remote)
# local_path      → subdirectory under agents/ that contains a Dockerfile
# local_image     → image tag to use when building/running locally

agents:
  - id: "web-scraper-01"
    name: "Web Scraping Specialist"
    description: "Autonomous agent for extracting data from websites"
    version: "1.0.0"
    docker_image: "ghcr.io/johnnywhitemike/agents/web-scraper:latest"
    local_image: "cade-web-scraper:latest"
    local_path: "web-scraper"
    available: true
    skills:
      - "Python"
      - "Selenium"
      - "BeautifulSoup"
      - "Web Scraping"
      - "Data Extraction"
      - "Pandas"
    categories:
      - "automation"
      - "data_science"
    capabilities:
      - "Static website scraping"
      - "JavaScript-heavy site scraping"
      - "Data export (CSV, JSON, Excel)"
      - "Pagination handling"
      - "Dynamic content extraction"
    performance_score: 0.92
    hourly_cost: 20
    estimated_capacity: 5
    resource_requirements:
      memory: "1GB"
      cpu: "0.5"

  - id: "python-web-dev-01"
    name: "Python Web Developer"
    description: "Full-stack Python web development agent"
    version: "1.0.0"
    docker_image: "ghcr.io/johnnywhitemike/agents/python-web:latest"
    local_image: ""
    local_path: ""
    available: false
    skills:
      - "Python"
      - "Django"
      - "FastAPI"
      - "Flask"
      - "PostgreSQL"
      - "Docker"
      - "REST APIs"
    categories:
      - "web_development"
      - "api_development"
      - "database"
    capabilities:
      - "Web application development"
      - "REST API creation"
      - "Database design"
      - "Backend architecture"
      - "API integration"
    performance_score: 0.95
    hourly_cost: 35
    estimated_capacity: 3
    resource_requirements:
      memory: "2GB"
      cpu: "1.0"

  - id: "data-analyst-01"
    name: "Data Analysis Expert"
    description: "Data analysis and visualization specialist"
    version: "1.0.0"
    docker_image: "ghcr.io/johnnywhitemike/agents/data-analyst:latest"
    local_image: ""
    local_path: ""
    available: false
    skills:
      - "Python"
      - "Pandas"
      - "NumPy"
      - "Matplotlib"
      - "Seaborn"
      - "SQL"
      - "Data Analysis"
      - "Statistics"
    categories:
      - "data_science"
      - "database"
    capabilities:
      - "Data cleaning and preprocessing"
      - "Statistical analysis"
      - "Data visualization"
      - "Report generation"
      - "SQL queries"
    performance_score: 0.90
    hourly_cost: 30
    estimated_capacity: 4
    resource_requirements:
      memory: "2GB"
      cpu: "1.0"

  - id: "react-dev-01"
    name: "React Frontend Developer"
    description: "Modern React frontend development"
    version: "1.0.0"
    docker_image: "ghcr.io/johnnywhitemike/agents/react-dev:latest"
    local_image: ""
    local_path: ""
    available: false
    skills:
      - "React"
      - "JavaScript"
      - "TypeScript"
      - "HTML"
      - "CSS"
      - "Redux"
      - "Next.js"
    categories:
      - "web_development"
    capabilities:
      - "React component development"
      - "Frontend architecture"
      - "UI implementation"
      - "State management"
      - "API integration"
    performance_score: 0.88
    hourly_cost: 32
    estimated_capacity: 3
    resource_requirements:
      memory: "1.5GB"
      cpu: "0.75"

  - id: "devops-specialist-01"
    name: "DevOps & Infrastructure Specialist"
    description: "CI/CD, Docker, and cloud infrastructure"
    version: "1.0.0"
    docker_image: "ghcr.io/johnnywhitemike/agents/devops:latest"
    local_image: ""
    local_path: ""
    available: false
    skills:
      - "Docker"
      - "Kubernetes"
      - "CI/CD"
      - "AWS"
      - "Terraform"
      - "GitHub Actions"
      - "Linux"
    categories:
      - "devops"
    capabilities:
      - "Container orchestration"
      - "CI/CD pipeline setup"
      - "Infrastructure as code"
      - "Cloud deployment"
      - "System automation"
    performance_score: 0.91
    hourly_cost: 40
    estimated_capacity: 2
    resource_requirements:
      memory: "1GB"
      cpu: "0.5"

# Agent repository configuration
repository:
  url: "https://github.com/JOHNNYWHITEMIKE/list"
  registry: "ghcr.io/johnnywhitemike/agents"
  pull_policy: "IfNotPresent"

# Global agent settings
settings:
  max_concurrent_agents: 10
  default_timeout: 3600
  health_check_interval: 60
  auto_cleanup: true
  log_retention_days: 7
