# C-A-D-E Docker Compose Configuration
# Autonomous Agent Studio + Infrastructure Layer
# Orchestration platform for building, testing, and deploying AI agents

services:
  # FastAPI Backend - Agent Orchestration API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cade-network

  # React Frontend - Agent Management UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - cade-network

networks:
  cade-network:
    driver: bridge
